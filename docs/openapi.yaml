openapi: 3.1.0
info:
  title: EMBR API
  description: >
    API for the EMBR perimenopause and menopause health platform.
    OpenAPI-first: this spec is the source of truth for request/response
    contracts. New endpoints are documented here before (or alongside)
    implementation, and packages/sdk generates typed clients from it.
  version: 0.1.0
  contact:
    name: EMBR Engineering
servers:
  - url: http://localhost:4000
    description: Local development
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns 200 if the process is running. Does not check dependencies.
      tags: [Health]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /health/ready:
    get:
      summary: Readiness probe
      description: Returns 200 only if the database and Redis are both reachable.
      tags: [Health]
      responses:
        "200":
          description: Service and dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
        "503":
          description: One or more dependencies are unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
  /auth/csrf:
    get:
      summary: Issue a CSRF token
      description: >
        Sets the CSRF cookie and returns the token in the response body.
        Call once on app load and before any state-changing auth request;
        echo the returned value back in the `x-csrf-token` header.
      tags: [Auth]
      responses:
        "200":
          description: CSRF token issued
  /auth/register:
    post:
      summary: Register a new account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        "201":
          description: Account created — a verification email has been sent
        "409":
          description: An account with this email already exists
        "429":
          description: Too many registration attempts from this IP
  /auth/verify-email:
    post:
      summary: Consume an email-verification token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "204": { description: Email verified }
        "400": { description: Token invalid or expired }
  /auth/resend-verification:
    post:
      summary: Resend the verification email
      description: Always returns 202, regardless of whether the account exists or is already verified, to avoid email enumeration.
      tags: [Auth]
      responses:
        "202": { description: Accepted }
  /auth/login:
    post:
      summary: Log in with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: >
            Sets embr_at (access token), embr_rt (refresh token), and
            embr_csrf cookies; also returns the access token in the body
            for non-browser clients.
        "401": { description: Invalid email or password }
        "429": { description: Too many login attempts for this account/IP }
  /auth/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token
      description: Requires the embr_rt cookie and a matching x-csrf-token header.
      tags: [Auth]
      responses:
        "200": { description: New access/refresh tokens issued }
        "401": { description: Session expired, already used, or reuse detected }
        "403": { description: Missing or invalid CSRF token }
  /auth/logout:
    post:
      summary: Revoke the current session
      tags: [Auth]
      responses:
        "204": { description: Logged out }
        "403": { description: Missing or invalid CSRF token }
  /auth/logout-all:
    post:
      summary: Revoke every session for the current user
      security: [{ cookieAuth: [] }]
      tags: [Auth]
      responses:
        "204": { description: All sessions revoked }
  /auth/forgot-password:
    post:
      summary: Request a password reset email
      description: Always returns 202 regardless of whether the account exists, to avoid email enumeration.
      tags: [Auth]
      responses:
        "202": { description: Accepted }
  /auth/reset-password:
    post:
      summary: Reset a password using an emailed token
      description: Revokes every existing session for the account on success.
      tags: [Auth]
      responses:
        "204": { description: Password reset }
        "400": { description: Token invalid or expired }
  /auth/change-password:
    post:
      summary: Change the current user's password
      description: Requires the current password; revokes every session (including the current one) on success.
      security: [{ cookieAuth: [] }]
      tags: [Auth]
      responses:
        "204": { description: Password changed }
        "400": { description: Current password incorrect }
  /auth/me:
    get:
      summary: Get the current authenticated user
      security: [{ cookieAuth: [] }]
      tags: [Auth]
      responses:
        "200": { description: Current user }
        "401": { description: Not authenticated }
  /auth/sessions:
    get:
      summary: List active device sessions for the current user
      security: [{ cookieAuth: [] }]
      tags: [Auth]
      responses:
        "200": { description: Active sessions, with the current one flagged }
  /auth/sessions/{id}:
    delete:
      summary: Revoke a specific device session
      security: [{ cookieAuth: [] }]
      tags: [Auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session revoked }
        "404": { description: No active session with that id for this user }
  /symptom-logs:
    post:
      summary: Log a symptom occurrence
      security: [{ cookieAuth: [] }]
      tags: [Symptoms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, severity, occurredAt]
              properties:
                category: { $ref: "#/components/schemas/SymptomCategory" }
                severity: { $ref: "#/components/schemas/SeverityLevel" }
                occurredAt: { type: string, format: date-time }
                notes: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Symptom log created }
    get:
      summary: List the current user's symptom logs
      security: [{ cookieAuth: [] }]
      tags: [Symptoms]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/SymptomCategory" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Paginated symptom logs }
  /symptom-logs/{id}:
    get:
      summary: Get a single symptom log
      security: [{ cookieAuth: [] }]
      tags: [Symptoms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Symptom log }
        "404": { description: No log with that id owned by this user }
    patch:
      summary: Update a symptom log
      security: [{ cookieAuth: [] }]
      tags: [Symptoms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated symptom log }
        "404": { description: No log with that id owned by this user }
    delete:
      summary: Delete a symptom log
      security: [{ cookieAuth: [] }]
      tags: [Symptoms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: No log with that id owned by this user }
  /cycle-entries:
    post:
      summary: Create or replace the cycle entry for a date
      description: Upsert keyed on (user, date) — calling again for the same date overwrites rather than duplicating.
      security: [{ cookieAuth: [] }]
      tags: [Cycle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                flow: { $ref: "#/components/schemas/FlowIntensity" }
                isPeriodStart: { type: boolean, default: false }
                isPeriodEnd: { type: boolean, default: false }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Entry created or replaced }
    get:
      summary: List the current user's cycle entries
      security: [{ cookieAuth: [] }]
      tags: [Cycle]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Paginated cycle entries }
  /cycle-entries/{id}:
    get:
      summary: Get a single cycle entry
      security: [{ cookieAuth: [] }]
      tags: [Cycle]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Cycle entry }
        "404": { description: No entry with that id owned by this user }
    patch:
      summary: Update a cycle entry (all fields except date)
      security: [{ cookieAuth: [] }]
      tags: [Cycle]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated cycle entry }
        "404": { description: No entry with that id owned by this user }
    delete:
      summary: Delete a cycle entry
      security: [{ cookieAuth: [] }]
      tags: [Cycle]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: No entry with that id owned by this user }
  /export/symptom-logs.csv:
    get:
      summary: Download symptom logs as CSV
      security: [{ cookieAuth: [] }]
      tags: [Export]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: "CSV file (Content-Disposition: attachment)"
          content:
            text/csv: {}
  /export/cycle-entries.csv:
    get:
      summary: Download cycle entries as CSV
      security: [{ cookieAuth: [] }]
      tags: [Export]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: "CSV file (Content-Disposition: attachment)"
          content:
            text/csv: {}
  /export/summary.pdf:
    get:
      summary: Download a clinician-facing PDF summary
      description: Symptom frequency, cycle length, and the full symptom log for the range — deliberately non-diagnostic language throughout.
      security: [{ cookieAuth: [] }]
      tags: [Export]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: "PDF file (Content-Disposition: attachment)"
          content:
            application/pdf: {}
  /trends/symptom-frequency:
    get:
      summary: Symptom frequency by category (DB-side aggregate)
      description: COUNT ... GROUP BY category, computed entirely in Postgres — not subject to the pageSize:100 cap the list endpoints have.
      security: [{ cookieAuth: [] }]
      tags: [Trends]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Symptom counts by category, sorted descending
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { $ref: "#/components/schemas/SymptomCategory" }
                    count: { type: integer }
  /trends/cycle-length:
    get:
      summary: Cycle length between period starts
      description: Sequential diff between consecutive period-start dates in the range, plus the average. Cycle irregularity is expected during perimenopause; this is not a diagnostic signal.
      security: [{ cookieAuth: [] }]
      tags: [Trends]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Cycle-length entries and the average over the range
          content:
            application/json:
              schema:
                type: object
                properties:
                  averageDays: { type: integer, nullable: true }
                  lengths:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: string, format: date }
                        to: { type: string, format: date }
                        days: { type: integer }
  /admin/users:
    get:
      summary: List user accounts (admin only)
      description: Account metadata only — never symptom/cycle data. Requires the ADMIN role.
      security: [{ cookieAuth: [] }]
      tags: [Admin]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated user accounts }
        "403": { description: Authenticated but not an admin }
  /admin/audit-logs:
    get:
      summary: List the security audit trail (admin only)
      security: [{ cookieAuth: [] }]
      tags: [Admin]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Paginated audit log entries }
        "403": { description: Authenticated but not an admin }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: embr_at
  schemas:
    SymptomCategory:
      type: string
      enum:
        [
          HOT_FLASH,
          NIGHT_SWEATS,
          MOOD_CHANGE,
          SLEEP_DISTURBANCE,
          BRAIN_FOG,
          JOINT_PAIN,
          FATIGUE,
          ANXIETY,
          IRREGULAR_HEARTBEAT,
          VAGINAL_DRYNESS,
          LIBIDO_CHANGE,
          WEIGHT_CHANGE,
          HEADACHE,
          OTHER,
        ]
    SeverityLevel:
      type: string
      enum: [MILD, MODERATE, SEVERE]
    FlowIntensity:
      type: string
      enum: [SPOTTING, LIGHT, MEDIUM, HEAVY]
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        uptimeSeconds:
          type: integer
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, down]
              latencyMs:
                type: number
              message:
                type: string
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
