version: 2
updates:
  # Single root entry: pnpm workspaces resolve from the lockfile at the
  # repo root, so Dependabot only needs one npm ecosystem entry here —
  # not one per app/package — to see every workspace's dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor bumps across the workspace are low-risk and noisy
      # one-PR-per-package; group them so review is one PR per week
      # instead of a dozen. Major bumps are not opened at all (see
      # ignore below).
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Major upgrades (Next, Tailwind, Prisma, ESLint...) are migrations, not
    # bumps: they are planned and done deliberately, not opened weekly.
    # New security advisories are still caught by the dependency audit
    # in CI, whatever their version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo pins these to the versions its SDK was built against (see
      # expo/bundledNativeModules.json). A plain semver bump breaks the
      # mobile app: #209 moved react-native 0.86.2 to 0.87.1 and react
      # to 19.3 under Expo SDK 57, and mobile typecheck failed. Upgrade
      # them together with `npx expo install --fix` (or an SDK upgrade)
      # in apps/mobile instead. react and react-dom are shared with the
      # web and admin apps, which stay on the same React version.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/worker"
      - "/apps/web"
      - "/apps/admin"
    schedule:
      interval: "weekly"
      day: "monday"
    # Node major versions change the base image (Node 25+ drops corepack,
    # which every Dockerfile uses), so they are upgraded deliberately with
    # a tested image build. Patch and minor image updates still arrive.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
