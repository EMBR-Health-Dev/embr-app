name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "9.12.0"

jobs:
  # format, lint, and typecheck were previously three sequential steps in
  # one job -- if format:check failed, lint and typecheck never even ran,
  # so a PR showing "Lint & Typecheck failed" told you nothing about which
  # of the three actually broke without opening the log. Split into three
  # independent jobs so each is its own status check, all three always
  # run, and they run in parallel instead of sequentially. The tradeoff is
  # three separate `pnpm install` steps instead of one; with pnpm's store
  # cache (actions/setup-node's cache: "pnpm") this is a low-single-digit
  # seconds cost on a cache hit, which is worth it for the clearer signal.
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # eslint.config.js uses tseslint's non-type-checked `recommended`
      # preset (no parserOptions.project), so lint -- unlike typecheck --
      # doesn't need the generated Prisma client to run.
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      - run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: embr
          POSTGRES_PASSWORD: embr_test_password
          POSTGRES_DB: embr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://embr:embr_test_password@localhost:5432/embr_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-only-access-secret-not-for-prod-use-32ch
      JWT_REFRESH_SECRET: ci-test-only-refresh-secret-not-for-prod-use-32ch
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      # prisma migrate deploy exits 0 and logs "No pending migrations
      # to apply" when apps/api/prisma/migrations is empty or missing —
      # it does not fail. Every test in this suite mocks prisma.js and
      # never touches the real Postgres service container below, so a
      # silently-empty migrations directory would otherwise never
      # surface as a CI failure at all (see docs/MIGRATION-AUDIT.md).
      # This check exists specifically so that blind spot can't persist
      # unnoticed once real migrations exist and one of them is ever
      # accidentally missing from a commit.
      - name: Verify migration history exists
        run: |
          if [ -z "$(ls -A apps/api/prisma/migrations 2>/dev/null)" ]; then
            echo "::error::apps/api/prisma/migrations is empty or missing — 'prisma migrate deploy' below would silently apply nothing. See docs/MIGRATION-AUDIT.md."
            exit 1
          fi
      - run: pnpm --filter @embr/api exec prisma migrate deploy
      - run: pnpm test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-report
          path: apps/api/coverage
          retention-days: 14

  security:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # audit-level high: informational/low-severity advisories are common
      # noise in a fast-moving JS ecosystem and would make this job cry
      # wolf; high/critical is the bar worth blocking a PR over.
      - name: Dependency audit (pnpm audit)
        run: pnpm audit --audit-level high
        continue-on-error: false
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (this one) as of its v2 licensing change --
      # the underlying gitleaks scanner itself is still free/open-source
      # (MIT), only that convenience wrapper started gating on a commercial
      # license. gacts/gitleaks wraps the same scanner without that gate.
      # If a GITLEAKS_LICENSE secret gets added later (e.g. for the PR-
      # commenting/SARIF features the official action adds), this can
      # switch back.
      - name: Secret scan (gitleaks)
        uses: gacts/gitleaks@v1

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      - run: pnpm build

  # Issue #98: lint/typecheck/test/build all previously passed on a commit
  # that made the API unbootable in both dev and production — vitest's
  # module interop masked the exact CommonJS/ESM import bug that crashes
  # `node dist/server.js` outright (see #96/#95). This job is the only one
  # that actually starts the compiled production entrypoint and proves it
  # reaches a listening state, closing that gap. No Postgres/Redis service
  # is configured here deliberately: Prisma connects lazily, only on its
  # first real query, and ioredis's own connection attempt (lib/redis.ts
  # has lazyConnect: false, so it does try eagerly) is asynchronous and
  # non-blocking, with an attached 'error' listener that logs and
  # continues rather than crashing the process — so an unreachable dummy
  # connection string on either doesn't stop the server from finishing
  # boot and calling .listen(). /health/live is also specifically the
  # DB/Redis-independent probe (see health.ts) for the same reason — so
  # dummy, unreachable connection strings are sufficient to prove a real
  # boot, without the added weight of standing up real services for it.
  boot-smoke:
    name: API Boot Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # A separate job runs on its own fresh runner with no filesystem
      # shared with the `build` job above, so the workspace packages
      # @embr/api actually imports at runtime have to be built here too —
      # matching the same prisma generate + build pattern already used by
      # the typecheck/test/build jobs above, since apps/api's own build
      # step fails without a generated Prisma client to import.
      - run: pnpm --filter @embr/shared --filter @embr/types --filter @embr/validation build
      - run: pnpm --filter @embr/api exec prisma generate
      - run: pnpm --filter @embr/api build
      - name: Boot the built API and probe it
        working-directory: apps/api
        run: |
          export DATABASE_URL="postgresql://ci:ci@localhost:5432/ci"
          export REDIS_URL="redis://localhost:6379"
          export JWT_ACCESS_SECRET="ci-only-access-secret-32-chars-min!"
          export JWT_REFRESH_SECRET="ci-only-refresh-secret-32-chars-min!"
          export SSO_ENCRYPTION_KEY="$(head -c 32 /dev/zero | base64)"
          export ANTHROPIC_API_KEY="ci-placeholder"
          # --trace-uncaught: keeps the stack trace for an uncaught
          # exception, which is otherwise lost by the time it's thrown —
          # diagnostic only, doesn't change what the process does.
          node --trace-uncaught dist/server.js > /tmp/boot.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            grep -q "api listening" /tmp/boot.log && ok=1 && break
            # Diagnostic: distinguishes "hanging" from "exited early"
            # immediately, rather than waiting out the full 30s for a
            # process that's already gone. `wait` on a job started with
            # `&` in this same shell is how bash retrieves its real exit
            # code — `$?` right after a bare `kill -0` would only reflect
            # the signal-probe's own result, not the process's.
            #
            # `|| exitcode=$?`, not a bare `wait "$PID"`, matters here
            # specifically: an unspecified `shell:` on a Linux runner
            # invokes `run:` steps as `bash -e {0}` (confirmed against
            # actions/runner's own ADR 0277, not assumed) — a bare `wait`
            # returning the crashed process's own non-zero code would
            # abort this whole script right here, silently, before the
            # echo below ever ran. This is exactly what the first attempt
            # at this diagnostic block did, and exactly why it produced
            # no custom error message at all in CI, only GitHub's own
            # generic "Process completed with exit code 1" - reproduced
            # and confirmed locally under `bash -e` before writing this
            # fix, not guessed at.
            if ! kill -0 "$PID" 2>/dev/null; then
              exitcode=0
              wait "$PID" || exitcode=$?
              echo "::error::node dist/server.js exited early (code $exitcode) after ${i}s, before logging 'api listening'"
              break
            fi
            sleep 1
          done
          # Unconditional, not just on failure: printed as a folded group
          # so a passing run stays easy to skim, but this pass's own
          # baseline (what does a *successful* boot's log/process/ps
          # state actually look like) is exactly the comparison point a
          # future failure needs, and won't exist yet if this only prints
          # when something's already gone wrong.
          echo "::group::Boot diagnostics"
          echo "--- is PID $PID still alive? ---"
          kill -0 "$PID" 2>/dev/null && echo "yes" || echo "no"
          echo "--- ps snapshot ---"
          ps -eo pid,ppid,stat,etime,cmd | grep -E "PID|node|$PID" || true
          echo "--- /tmp/boot.log, last 200 lines ---"
          tail -n 200 /tmp/boot.log || echo "(no boot.log content)"
          echo "::endgroup::"
          # Only on the "never booted" failure path, and only if there's
          # something to say: regular stdout (everything printed above,
          # inside the fold) isn't retrievable through the Checks API at
          # all, confirmed by this diagnostic's own first real run - the
          # exit-code annotation came through, but this group's own
          # output did not, anywhere the API exposes it. ::error:: text
          # does become a real, API-visible annotation, so this is purely
          # about making already-captured evidence reachable through a
          # channel that actually is, not gathering anything new.
          if [ "$ok" != "1" ] && [ -s /tmp/boot.log ]; then
            echo "::error::boot.log content: $(tr '\n' '|' < /tmp/boot.log | head -c 800)"
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::API did not log 'api listening' within 30s"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          # Captured explicitly, not relied on as the script's own exit
          # code: `kill` below runs unconditionally either way (this job's
          # one and only cleanup step, satisfying "always clean up the
          # background process" for both outcomes), and without capturing
          # this first, a failing curl followed by a succeeding kill would
          # leave the step's real exit code as kill's success, not curl's
          # failure — silently passing a job that should fail.
          if curl -sf http://localhost:4000/health/live; then
            status=0
          else
            status=$?
            echo "::error::/health/live probe failed"
          fi
          kill "$PID" 2>/dev/null || true
          exit "$status"
