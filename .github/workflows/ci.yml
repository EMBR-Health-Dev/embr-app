name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "9.12.0"

jobs:
  # format, lint, and typecheck were previously three sequential steps in
  # one job -- if format:check failed, lint and typecheck never even ran,
  # so a PR showing "Lint & Typecheck failed" told you nothing about which
  # of the three actually broke without opening the log. Split into three
  # independent jobs so each is its own status check, all three always
  # run, and they run in parallel instead of sequentially. The tradeoff is
  # three separate `pnpm install` steps instead of one; with pnpm's store
  # cache (actions/setup-node's cache: "pnpm") this is a low-single-digit
  # seconds cost on a cache hit, which is worth it for the clearer signal.
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # eslint.config.js uses tseslint's non-type-checked `recommended`
      # preset (no parserOptions.project), so lint -- unlike typecheck --
      # doesn't need the generated Prisma client to run.
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      - run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: embr
          POSTGRES_PASSWORD: embr_test_password
          POSTGRES_DB: embr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://embr:embr_test_password@localhost:5432/embr_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-only-access-secret-not-for-prod-use-32ch
      JWT_REFRESH_SECRET: ci-test-only-refresh-secret-not-for-prod-use-32ch
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      # prisma migrate deploy exits 0 and logs "No pending migrations
      # to apply" when apps/api/prisma/migrations is empty or missing —
      # it does not fail. Every test in this suite mocks prisma.js and
      # never touches the real Postgres service container below, so a
      # silently-empty migrations directory would otherwise never
      # surface as a CI failure at all (see docs/MIGRATION-AUDIT.md).
      # This check exists specifically so that blind spot can't persist
      # unnoticed once real migrations exist and one of them is ever
      # accidentally missing from a commit.
      - name: Verify migration history exists
        run: |
          if [ -z "$(ls -A apps/api/prisma/migrations 2>/dev/null)" ]; then
            echo "::error::apps/api/prisma/migrations is empty or missing — 'prisma migrate deploy' below would silently apply nothing. See docs/MIGRATION-AUDIT.md."
            exit 1
          fi
      - run: pnpm --filter @embr/api exec prisma migrate deploy
      - run: pnpm test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-report
          path: apps/api/coverage
          retention-days: 14

  security:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # This repo pins pnpm 9.x (PNPM_VERSION above). pnpm's native
      # `--ignore <GHSA>` flag and the auditConfig.ignoreGhsas
      # package.json setting were only added in pnpm v11 -- on 9.x
      # there is no `--ignore` flag at all, and the only ignore
      # mechanism that exists, auditConfig.ignoreCves, filters by CVE
      # identifier only. Both advisories below have a GHSA id but no
      # assigned CVE, so ignoreCves cannot match them either. This
      # step filters pnpm's own JSON report instead, which works
      # against the pinned version -- confirmed empirically that
      # `pnpm audit --json` (unlike the table output) ignores
      # --audit-level entirely and returns every advisory regardless
      # of severity, so the severity>=high filter below is
      # re-implemented here rather than assumed to already be applied.
      #
      # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: both are
      # image-size@<=2.0.2 (DoS via infinite loops in the ICNS / JXL+HEIF
      # parsers), reached only through the Expo/metro dev-tooling
      # dependency tree in apps/mobile -- none of it ships in the
      # api/web/admin/worker production images. Both advisories' patched
      # range is `<0.0.0`: no fixed release exists upstream as of this
      # writing, so there is nothing to upgrade to.
      # REMOVE-BY: drop both entries from IGNORED_GHSAS and bump
      # image-size past 2.0.2 once a patched release exists -- watch
      # https://github.com/advisories/GHSA-w3rx-r6r6-pgpr and
      # https://github.com/advisories/GHSA-5p2g-fcmc-qvqq for a fix
      # release, then remove the ignores in the same PR as the bump.
      #
      # Two additional MODERATE advisories currently exist
      # (decode-uri-component GHSA-vcc3-ghjq-m6fr, @opentelemetry/core
      # GHSA-8988-4f7v-96qf) -- both DO have patched releases available
      # upstream, unlike the two above. They don't fail this
      # high-severity gate and are deliberately left out of
      # IGNORED_GHSAS (nothing here suppresses them), but they're worth
      # a separate, deliberate dependency-bump PR rather than fixing
      # silently as a side effect of this one.
      # audit-level high: informational/low-severity advisories are common
      # noise in a fast-moving JS ecosystem and would make this job cry
      # wolf; high/critical is the bar worth blocking a PR over.
      # REMOVE-BY condition: drop the ignores and bump image-size past 2.0.2 once a patched
      # release exists.
      - name: Dependency audit (pnpm audit)
        run: |
          IGNORED_GHSAS=("GHSA-w3rx-r6r6-pgpr" "GHSA-5p2g-fcmc-qvqq")

          REPORT="$(pnpm audit --json || true)"

          REMAINING="$(echo "$REPORT" | jq -r --argjson ignored "$(printf '%s\n' "${IGNORED_GHSAS[@]}" | jq -R . | jq -s .)" \
            '[.advisories[]?
               | select(.severity == "high" or .severity == "critical")
               | select(([.github_advisory_id] | inside($ignored)) | not)]')"

          COUNT="$(echo "$REMAINING" | jq 'length')"

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::pnpm audit found $COUNT high/critical advisory(ies) not covered by an approved ignore:"
            echo "$REMAINING" | jq -r '.[] | "  \(.github_advisory_id)  \(.severity)  \(.module_name)"'
            exit 1
          fi

          echo "pnpm audit: no high/critical advisories outside the approved ignore list (${IGNORED_GHSAS[*]})."
        continue-on-error: false
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (this one) as of its v2 licensing change --
      # the underlying gitleaks scanner itself is still free/open-source
      # (MIT), only that convenience wrapper started gating on a commercial
      # license. gacts/gitleaks wraps the same scanner without that gate.
      # If a GITLEAKS_LICENSE secret gets added later (e.g. for the PR-
      # commenting/SARIF features the official action adds), this can
      # switch back.
      - name: Secret scan (gitleaks)
        uses: gacts/gitleaks@v1

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      - run: pnpm build

  boot-smoke:
    name: Boot Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embr/api exec prisma generate
      # lint/typecheck/test/build all pass without ever actually
      # starting the process — none of them catch a bug that makes the
      # server crash (or hang) between process start and the first
      # app.listen() callback. That already happened once: a bug made
      # the API unbootable in dev AND production with a fully green CI
      # run, because vitest's module interop masked it at test time
      # (see #96, #98). This job is the only one that actually runs
      # `node dist/server.js` and proves the process reaches
      # "api listening" and answers a real HTTP request.
      - run: pnpm --filter @embr/shared --filter @embr/types --filter @embr/validation build
      - run: pnpm --filter @embr/api build
      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: "7"
      - name: Boot the built API and probe it
        working-directory: apps/api
        run: |
          export DATABASE_URL="postgresql://ci:ci@localhost:5432/ci"
          export REDIS_URL="redis://localhost:6379"
          export JWT_ACCESS_SECRET="ci-only-access-secret-32-chars-min!"
          export JWT_REFRESH_SECRET="ci-only-refresh-secret-32-chars-min!"
          export SSO_ENCRYPTION_KEY="$(head -c 32 /dev/zero | base64)"
          export ANTHROPIC_API_KEY="ci-placeholder"
          node dist/server.js > /tmp/boot.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            grep -q "api listening" /tmp/boot.log && ok=1 && break
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/boot.log; kill "$PID"; exit 1; fi
          curl -sf http://localhost:4000/health/live
          kill "$PID"
